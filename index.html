<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Fiscal & Monetary Policy Games</title>

<style>
:root{
  --bg:#0b1220;
  --text:#e7eefc;
  --muted:#a8b4cf;
  --border:rgba(255,255,255,.12);
  --accent:#7aa2ff;
  --shadow:0 18px 55px rgba(0,0,0,.35);
  --radius:18px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:radial-gradient(900px 500px at 20% 20%,rgba(122,162,255,.18),transparent 60%),var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}
.app{
  width:min(900px,100%);
  background:rgba(0,0,0,.25);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  border-radius:22px;
}
header{
  padding:18px;
  border-bottom:1px solid var(--border);
}
h1{margin:0;font-size:20px}
.sub{margin-top:6px;color:var(--muted);font-size:13px}
main{padding:18px}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
@media(max-width:700px){
  .grid{grid-template-columns:1fr}
}
a.card{
  display:block;
  text-decoration:none;
  color:var(--text);
  border:1px solid var(--border);
  background:rgba(255,255,255,.04);
  border-radius:var(--radius);
  padding:14px;
}
a.card:hover{
  border-color:rgba(122,162,255,.55);
  transform:translateY(-1px);
}
.title{font-weight:800;margin-bottom:6px}
.desc{font-size:12.5px;color:var(--muted)}
.note{
  margin-top:14px;
  color:var(--muted);
  font-size:12.5px;
  border-top:1px solid var(--border);
  padding-top:14px;
}
</style>
</head>

<body>
<div class="app">

<header>
<h1>Fiscal & Monetary Policy Games</h1>
<div class="sub">
Each game requires <b>100% accuracy</b> to earn a submit ticket.
</div>
</header>

<main>

<div class="grid">

<a class="card" href="fiscal-policy-game.html">
  <div class="title">Fiscal Policy Game</div>
  <p class="desc">Government spending and taxation decisions.</p>
</a>

<a class="card" href="monetary-policy-game.html">
  <div class="title">Monetary Policy Game</div>
  <p class="desc">Federal Reserve tools and money supply.</p>
</a>

</div>

<div class="note">
If a link shows 404, the filename must exactly match the repo file.
</div>

</main>
</div>
</body>
</html>
